version: 2

models:
  # ========================================================================
  # Gold layer: customer/account/trade dimensions and the fact tables that
  # reference them. Surrogate keys link back to the conformed dimensions.
  # ========================================================================

  # --- Dimensions ---------------------------------------------------------
  - name: DimCustomer
    description: >
      Slowly-changing (type 2) customer dimension. Combines the historical
      CustomerMgmt actions with the Batch2/3 incremental Customer feed,
      forward-fills attributes, resolves tax rates, and stamps prospect
      marketing data onto matching customers.
    columns:
      - name: sk_customerid
        description: Surrogate key combining effective date and customer id.
        data_tests:
          - not_null
          - unique
      - name: customerid
        description: Natural key of the customer.
        data_tests:
          - not_null
      - name: status
        description: Resolved customer status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Completed', 'Canceled', 'Pending', 'Submitted', 'Inactive']
      - name: gender
        description: Normalised gender; non-M/F values are mapped to 'U'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F', 'U']
      - name: tier
        description: Customer tier (1-3).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: nationaltaxrate
        description: National tax rate resolved from the TaxRate reference table.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: localtaxrate
        description: Local tax rate resolved from the TaxRate reference table.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: iscurrent
        description: SCD2 current-row flag.
        data_tests:
          - not_null
      - name: effectivedate
        data_tests:
          - not_null
      - name: enddate
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "effectivedate < enddate"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customerid
              - effectivedate

  - name: DimAccount
    description: >
      Slowly-changing (type 2) account dimension. Stitches CustomerMgmt
      account actions with the incremental Account feed, forward-fills
      attributes, and joins to the broker and customer dimensions.
    columns:
      - name: sk_accountid
        description: Surrogate key combining effective date and account id.
        data_tests:
          - not_null
          - unique
      - name: accountid
        description: Natural key of the account.
        data_tests:
          - not_null
      - name: sk_brokerid
        description: Foreign key to the managing broker.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimBroker')
                field: sk_brokerid
      - name: sk_customerid
        description: Foreign key to the owning customer version.
        data_tests:
          - relationships:
              arguments:
                to: ref('DimCustomer')
                field: sk_customerid
      - name: taxstatus
        description: Account tax status code.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: status
        description: Resolved account status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Completed', 'Canceled', 'Pending', 'Submitted', 'Inactive']
      - name: iscurrent
        data_tests:
          - not_null
      - name: effectivedate
        data_tests:
          - not_null
      - name: enddate
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "effectivedate < enddate"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - accountid
              - effectivedate

  - name: DimTrade
    description: >
      Trade dimension. One row per trade, reconstructed from the historical
      TradeHistory and the incremental Trade CDC feed (latest status per
      trade), resolved against the security and account dimensions valid at
      trade-create time.
    columns:
      - name: tradeid
        description: Natural key of the trade.
        data_tests:
          - not_null
          - unique
      - name: status
        description: Resolved trade status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Completed', 'Canceled', 'Pending', 'Submitted', 'Inactive']
      - name: type
        description: Resolved trade type description.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Market Buy', 'Market Sell', 'Stop Loss', 'Limit Sell', 'Limit Buy']
      - name: cashflag
        description: Boolean flag indicating a cash (vs. margin) trade.
        data_tests:
          - not_null
      - name: sk_createdateid
        description: Foreign key to DimDate for the trade-create date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: sk_securityid
        description: Foreign key to the traded security version.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimSecurity')
                field: sk_securityid
      - name: sk_accountid
        description: Foreign key to the trading account version.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimAccount')
                field: sk_accountid
      - name: quantity
        description: Number of shares/units traded.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: tradeprice
        description: Execution price per unit.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: batchid
        data_tests:
          - not_null

  # --- Facts --------------------------------------------------------------
  - name: FactHoldings
    description: >
      Position-level holdings fact. One row per holding-history event,
      carrying the resulting share quantity and the price of the trade that
      produced it, joined to the trade dimension.
    columns:
      - name: tradeid
        description: The trade that originated the holding lot.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimTrade')
                field: tradeid
      - name: currenttradeid
        description: The trade that produced this holding state.
        data_tests:
          - not_null
      - name: sk_customerid
        description: Foreign key to the holding's customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimCustomer')
                field: sk_customerid
      - name: sk_securityid
        description: Foreign key to the held security.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimSecurity')
                field: sk_securityid
      - name: sk_dateid
        description: Foreign key to DimDate (trade close date).
        data_tests:
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: currentprice
        description: Price of the originating trade.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: currentholding
        description: Share quantity held after the event.
        data_tests:
          - not_null

  - name: FactCashBalances
    description: >
      Daily cash balance fact. Running per-account cash total derived from
      cash transactions, joined to the account dimension version valid on the
      transaction date.
    columns:
      - name: sk_customerid
        description: Foreign key to the customer.
        data_tests:
          - not_null
      - name: sk_accountid
        description: Foreign key to the account version.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimAccount')
                field: sk_accountid
      - name: sk_dateid
        description: Foreign key to DimDate.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: cash
        description: Running cash balance for the account as of the date.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_accountid
              - sk_dateid

  - name: FactWatches
    description: >
      Watch-list fact. One row per customer/security watch, capturing the
      date the watch was placed and (if applicable) removed.
    columns:
      - name: sk_customerid
        description: Foreign key to the watching customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimCustomer')
                field: sk_customerid
      - name: sk_securityid
        description: Foreign key to the watched security.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimSecurity')
                field: sk_securityid
      - name: sk_dateid_dateplaced
        description: Foreign key to DimDate for the date the watch was placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: sk_dateid_dateremoved
        description: Foreign key to DimDate for the date the watch was removed; null if still active.
        data_tests:
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_customerid
              - sk_securityid
              - sk_dateid_dateplaced

  - name: FactMarketHistory
    description: >
      Daily market history fact. One row per security per trading day, with
      close/high/low/volume, trailing 52-week high and low, dividend yield,
      and a P/E ratio computed from trailing-four-quarter basic EPS.
    columns:
      - name: sk_securityid
        description: Foreign key to the security version.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimSecurity')
                field: sk_securityid
      - name: sk_companyid
        description: Foreign key to the issuing company.
        data_tests:
          - not_null
      - name: sk_dateid
        description: Foreign key to DimDate (market date).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: closeprice
        description: Closing price for the day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: dayhigh
        description: Intraday high price.
      - name: daylow
        description: Intraday low price.
      - name: volume
        description: Shares traded during the day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_securityid
              - sk_dateid
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dayhigh >= daylow"
          config:
            where: "dayhigh is not null and daylow is not null"

  # --- Prospect staging + fact -------------------------------------------
  - name: ProspectIncremental
    description: >
      Deduplicated prospect records across all batches, deriving the
      marketing nameplate tags (HighValue+, Expenses+, Boomer+, etc.) and
      keeping the earliest/latest batch a prospect appeared in. Filtered to
      prospects whose latest appearance is batch 3.
    columns:
      - name: agencyid
        description: Marketing agency identifier for the prospect.
        data_tests:
          - not_null
      - name: recordbatchid
        description: Latest batch in which the prospect appeared (always 3 here).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [3]
                quote: false
      - name: batchid
        description: Earliest batch in which the prospect appeared.
        data_tests:
          - not_null
      - name: marketingnameplate
        description: Concatenated marketing segment tags, or null when none apply.

  - name: Prospect
    description: >
      Prospect fact. One row per prospect with the record/update date keys,
      a flag indicating whether the prospect is also an existing current
      customer, and the demographic attributes from the agency feed.
    columns:
      - name: agencyid
        description: Marketing agency identifier for the prospect.
        data_tests:
          - not_null
      - name: sk_recorddateid
        description: Foreign key to DimDate for the record date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: sk_updatedateid
        description: Foreign key to DimDate for the original/update date.
        data_tests:
          - relationships:
              arguments:
                to: ref('DimDate')
                field: sk_dateid
      - name: iscustomer
        description: True when the prospect matches a current DimCustomer record.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: gender
        description: Prospect gender from the agency feed.
      - name: marketingnameplate
        description: Concatenated marketing segment tags, or null when none apply.
